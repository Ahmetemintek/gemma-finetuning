model:
  name: "ytu-ce-cosmos/Turkish-Gemma-9b-v0.1"

data:
  train_file: "data/processed/train.jsonl"
  val_file: "data/processed/validation.jsonl"
  max_seq_length: 512

training:
  output_dir: "outputs/checkpoints"
  num_train_epochs: 2
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2e-4
  weight_decay: 0.01
  warmup_ratio: 0.05
  logging_steps: 25
  save_steps: 100
  eval_steps: 100
  seed: 42
